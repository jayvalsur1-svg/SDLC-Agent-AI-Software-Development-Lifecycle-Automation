# Alembic configuration for the TaskBoard database.
# Run migrations from the project root with `alembic upgrade head`.

[alembic]
# Migration environment and revision scripts live in the project-level alembic/ directory.
script_location = %(here)s/alembic

# Add the project root to sys.path so migrations can import the app package.
prepend_sys_path = .

# Keep revision files in a predictable order across platforms.
version_path_separator = os

# Default for standalone Alembic commands. The application's alembic/env.py
# should replace this value with app.config.DATABASE_URL so environment-based
# database configuration is shared by the application and migration runner.
sqlalchemy.url = sqlite:///./tasks.db


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
